name: maternal_wellness_app
description: "A holistic maternal wellness platform — pregnancy to postpartum companion app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State management ---
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # --- Dependency injection ---
  get_it: ^7.7.0
  injectable: ^2.4.4

  # --- Routing ---
  go_router: ^14.2.7

  # --- Networking & API ---
  dio: ^5.7.0
  retrofit: ^4.4.1
  connectivity_plus: ^6.0.5

  # --- Functional programming, immutability & serialization ---
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Local / secure storage ---
  flutter_secure_storage: ^9.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2
  retrofit_generator: ^9.1.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
